name: Open-Meteo cloud + fog grid (14-day, North Norway)

# Slow feed: Open-Meteo best_match low/mid/high cloud + visibility (fog) over a wide box
# (MEPS area + up-sun margin), 0.20 deg lat x 0.40 deg lon (~22 x 16 km), 2419 points per run,
# twice a day ~1 h 20 min after ECMWF IFS 00Z/12Z reach Open-Meteo (best_match here IS ecmwf_ifs
# 9 km at every lead time; only 00Z/12Z reach 15 days). 2 x 2419 = 4838 calls/day + Iceland 4608
# = 9446/day, under the free 10000/day; Iceland runs an hour earlier (5000/hour limit). A run skips
# itself (no API calls) if the published grid is < 5 h old, so an extra trigger can't double-spend.
# Supplies the app's Auto-mode gap fill beyond MEPS's +66 h, and fog beyond MEPS's range.
#
# Two jobs: the slow paced extraction runs in its own concurrency group so it never blocks
# the hourly MEPS deploys; only the short deploy job joins the shared "pages" group, and it
# copies the CURRENT MEPS/elements/stations right before deploying so it can't roll back a
# MEPS update that landed while the extraction was running.

on:
  schedule:
    - cron: '30 7,19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if the published grid is less than 5 h old (uses API calls)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Whole-run queue (incl. the deploy job): a second trigger (GitHub schedule + Worker backup) waits
# until the first has PUBLISHED, then its freshness check skips it -> never double-spends calls.
concurrency:
  group: meteo-extract
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SITE: https://avengingab1.github.io/norway-sky-data

jobs:
  extract-meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Skip if the published grid is still fresh (saves API calls)
        id: fresh
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; echo "forced run"; exit 0; fi
          AGE_H=$(curl -sf "$SITE/meteo_latest.json" | python3 -c "import sys,json,datetime as d; g=json.load(sys.stdin)['generated']; t=d.datetime.strptime(g[:16],'%Y-%m-%dT%H:%M').replace(tzinfo=d.timezone.utc); print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()//3600))" 2>/dev/null || echo 999)
          echo "published grid age: ${AGE_H} h"
          if [ "$AGE_H" -lt 5 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "still fresh: skipping (no API calls)"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.fresh.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.fresh.outputs.skip != 'true'
        run: pip install requests

      - name: Extract Open-Meteo cloud + fog grid
        if: steps.fresh.outputs.skip != 'true'
        run: |
          mkdir -p out
          (cd extract && python extract_meteo.py --out ../out/meteo_latest.json)
          ls -lh out

      - uses: actions/upload-artifact@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          name: meteo
          path: out/meteo_latest.json
          retention-days: 1

  deploy:
    needs: extract-meteo
    if: needs.extract-meteo.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared with meps.yml and NOT cancelling: Pages deploys queue one after another.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meteo
          path: _site

      - name: Preserve MEPS + elements + stations from current deploy
        run: |
          curl -sf "$SITE/meps_latest.json" -o _site/meps_latest.json || true
          curl -sf "$SITE/elements_latest.json" -o _site/elements_latest.json || true
          curl -sf "$SITE/stations.json" -o _site/stations.json || true
          touch _site/.nojekyll
          ls -lh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub's Pages API occasionally fails transiently ("Fetching artifact metadata failed",
      # "Failed to create deployment (status: 500)") although the artifact is fine. Retry once
      # after a minute instead of failing the run; the job only fails if the retry fails too.
      - name: Wait before retrying a failed Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
